name: Download Linkt Tolls

# Downloads recent trips from Linkt and saves the CSV to Google Drive. It never
# touches a database: each environment imports new files from its own Linkt
# folder setting (Settings > Integrations) when the Tolls page is opened.

on:
  schedule:
    - cron: "0 20 * * *" # 6am AEST (UTC+10) / 7am AEDT (UTC+11)
  workflow_dispatch:
    inputs:
      days:
        description: "Days of trips to look back over"
        required: false
        default: "14"

concurrency:
  group: linkt-tolls-download
  cancel-in-progress: false

jobs:
  download:
    name: Download Linkt trips to Google Drive
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"

      # Scripts are skipped because nothing here needs Prisma or a database
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          CI: true

      # Linkt's bot protection blocks headless Chrome, so run the preinstalled
      # Google Chrome headed inside a virtual display
      - name: Download trips from Linkt
        env:
          LINKT_USERNAME: ${{ secrets.LINKT_USERNAME }}
          LINKT_PASSWORD: ${{ secrets.LINKT_PASSWORD }}
          DOWNLOAD_DAYS: ${{ inputs.days || '14' }}
          LINKT_DEBUG_DIR: linkt-debug
        run: |
          set -eo pipefail
          if ! [[ "$DOWNLOAD_DAYS" =~ ^[0-9]+$ ]] || [ "$DOWNLOAD_DAYS" -lt 1 ] || [ "$DOWNLOAD_DAYS" -gt 90 ]; then
            echo "days must be a whole number from 1 to 90"
            exit 1
          fi
          mkdir -p "$LINKT_DEBUG_DIR"
          xvfb-run --auto-servernum pnpm exec tsx scripts/linkt/download-linkt-trips.ts --days "$DOWNLOAD_DAYS" --out linkt-export

      - name: Save sign-in screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: linkt-sign-in-screenshots
          path: linkt-debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure rclone
        env:
          GOOGLE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          if [ "${GOOGLE_SERVICE_ACCOUNT_CREDENTIALS#\{}" != "${GOOGLE_SERVICE_ACCOUNT_CREDENTIALS}" ]; then
            printf "%s" "${GOOGLE_SERVICE_ACCOUNT_CREDENTIALS}" > /tmp/sa-credentials.json
          else
            printf "%s" "${GOOGLE_SERVICE_ACCOUNT_CREDENTIALS}" | base64 --decode > /tmp/sa-credentials.json
          fi
          chmod 600 /tmp/sa-credentials.json
          mkdir -p ~/.config/rclone
          printf '[gdrive]\ntype = drive\nscope = drive\nservice_account_file = /tmp/sa-credentials.json\nteam_drive = 0AKVLLsT-s4xoUk9PVA\n' > ~/.config/rclone/rclone.conf

      - name: Upload to Google Drive
        run: |
          rclone copy linkt-export/ gdrive:linkt-tolls/ -v
          # Every environment has had months to import these by now
          rclone delete gdrive:linkt-tolls/ --min-age 90d -v

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/sa-credentials.json
          rm -rf linkt-export
